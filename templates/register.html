{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="container" style="max-width: 520px; padding-top: 40px; padding-bottom: 60px;">
    <div class="card border-0 shadow-lg">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <i class="bi bi-person-plus fs-1 text-primary"></i>
                <h3 class="fw-bold mt-2">Create Account</h3>
                <p class="text-muted">Join SmileCare community</p>
            </div>
            
            <form method="POST" action="{{ url_for('register') }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold"><i class="bi bi-person"></i> Full Name</label>
                    <input type="text" class="form-control form-control-lg" name="full_name" placeholder="Dr. John Doe" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold"><i class="bi bi-person-badge"></i> Username</label>
                    <input type="text" class="form-control form-control-lg" name="username" placeholder="johndoe" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold"><i class="bi bi-envelope"></i> Email</label>
                    <input type="email" class="form-control form-control-lg" name="email" placeholder="your@email.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold"><i class="bi bi-phone"></i> Phone</label>
                    <input type="tel" class="form-control form-control-lg" name="phone" placeholder="9876543210">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold"><i class="bi bi-lock"></i> Password</label>
                    <input type="password" class="form-control form-control-lg" name="password" placeholder="••••••••" required>
                    <small class="text-muted">Min 8 chars, 1 uppercase, 1 lowercase, 1 number</small>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold"><i class="bi bi-lock-fill"></i> Confirm Password</label>
                    <input type="password" class="form-control form-control-lg" name="confirm_password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-custom w-100 btn-lg">
                    <i class="bi bi-person-plus me-2"></i> Register
                </button>
            </form>
            
            <hr class="my-4">
            <p class="text-center mb-0">
                Already have an account? <a href="{{ url_for('login') }}" class="fw-bold text-primary">Sign In</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
