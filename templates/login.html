{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container" style="max-width: 480px; padding-top: 60px; padding-bottom: 60px;">
    <div class="card border-0 shadow-lg">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <i class="bi bi-hospital fs-1 text-primary"></i>
                <h3 class="fw-bold mt-2">Welcome Back</h3>
                <p class="text-muted">Sign in to your SmileCare account</p>
            </div>
            
            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold"><i class="bi bi-envelope"></i> Email</label>
                    <input type="email" class="form-control form-control-lg" name="email" placeholder="your@email.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold"><i class="bi bi-lock"></i> Password</label>
                    <input type="password" class="form-control form-control-lg" name="password" placeholder="••••••••" required>
                </div>
                <div class="mb-3 d-flex justify-content-between">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label class="form-check-label" for="remember">Remember me</label>
                    </div>
                    <a href="{{ url_for('forgot_password') }}" class="text-primary">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn-custom w-100 btn-lg">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Sign In
                </button>
            </form>
            
            <hr class="my-4">
            <p class="text-center mb-0">
                Don't have an account? <a href="{{ url_for('register') }}" class="fw-bold text-primary">Register Now</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
