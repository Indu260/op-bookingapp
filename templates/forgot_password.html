{% extends "base.html" %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="container" style="max-width: 480px; padding-top: 60px; padding-bottom: 60px;">
    <div class="card border-0 shadow-lg">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <i class="bi bi-key fs-1 text-primary"></i>
                <h3 class="fw-bold mt-2">Forgot Password</h3>
                <p class="text-muted">Enter your email to receive OTP</p>
            </div>
            
            <form method="POST" action="{{ url_for('forgot_password') }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold"><i class="bi bi-envelope"></i> Email Address</label>
                    <input type="email" class="form-control form-control-lg" name="email" placeholder="your@email.com" required>
                </div>
                <button type="submit" class="btn btn-custom w-100 btn-lg">
                    <i class="bi bi-send me-2"></i> Send OTP
                </button>
            </form>
            
            <hr class="my-4">
            <p class="text-center mb-0">
                Remember your password? <a href="{{ url_for('login') }}" class="fw-bold text-primary">Sign In</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
