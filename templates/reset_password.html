{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="container" style="max-width: 480px; padding-top: 60px; padding-bottom: 60px;">
    <div class="card border-0 shadow-lg">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock fs-1 text-primary"></i>
                <h3 class="fw-bold mt-2">Reset Password</h3>
                <p class="text-muted">Enter OTP and new password</p>
            </div>
            
            <form method="POST" action="{{ url_for('reset_password', email=email) }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold"><i class="bi bi-shield-check"></i> OTP</label>
                    <input type="text" class="form-control form-control-lg" name="otp" placeholder="Enter 6-digit OTP" required maxlength="6">
                    <small class="text-muted">Check your email for the OTP</small>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold"><i class="bi bi-lock"></i> New Password</label>
                    <input type="password" class="form-control form-control-lg" name="new_password" placeholder="••••••••" required>
                    <small class="text-muted">Min 8 chars, 1 uppercase, 1 lowercase, 1 number</small>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold"><i class="bi bi-lock-fill"></i> Confirm Password</label>
                    <input type="password" class="form-control form-control-lg" name="confirm_password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-custom w-100 btn-lg">
                    <i class="bi bi-check-circle me-2"></i> Reset Password
                </button>
            </form>
            
            <hr class="my-4">
            <p class="text-center mb-0">
                <a href="{{ url_for('forgot_password') }}" class="text-primary">Resend OTP</a> &bull;
                <a href="{{ url_for('login') }}" class="text-primary">Back to Login</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
